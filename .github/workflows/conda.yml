name: Build and test Conda packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conda:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
          activate-environment: packaging
          python-version: '3.12'
      - name: Build and test in isolated environments
        run: |
          set -euo pipefail
          mkdir -p .scratch/tmp .scratch/conda-bld
          export TMPDIR="$GITHUB_WORKSPACE/.scratch/tmp"
          conda install -y conda-build=26.9.1 2>&1 | tee .scratch/conda-build.log
          python -m conda build packaging/conda --override-channels -c conda-forge \
            --no-anaconda-upload --croot "$GITHUB_WORKSPACE/.scratch/conda-bld" \
            2>&1 | tee -a .scratch/conda-build.log
      - name: Summarize build failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('.scratch/conda-build.log')
          if log.exists():
              tail = '\n'.join(log.read_text(errors='replace').splitlines()[-25:])
              print('::error title=Conda build failure::' + tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soapnuke3-conda-${{ matrix.platform }}
          include-hidden-files: true
          path: |
            .scratch/conda-bld/${{ matrix.platform }}/soapnuke3-*.conda
            .scratch/conda-bld/${{ matrix.platform }}/soapnuke3-*.tar.bz2
            .scratch/conda-build.log
